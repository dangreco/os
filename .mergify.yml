---
queue_rules:
  - name: default
    branch_protection_injection_mode: queue
    queue_conditions:
      - title ~= chore\(deps\):.*
      # Require an approval review from CodeRabbit before a dependency PR is merged.
      - approved-reviews-by = coderabbitai
    merge_method: squash
    commit_message_format:
      title: pr-title
      body: inherit
      trailers: []
merge_protections:
  - name: build
    if: []
    success_conditions:
      - check-success = build
merge_protections_settings:
  auto_merge_conditions:
    - title ~= chore\(deps\):.*
