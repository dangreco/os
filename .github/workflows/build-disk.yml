---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# yamllint disable rule:line-length rule:comments
name: build-disk
on:
  workflow_dispatch:
env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: os
jobs:
  build-disk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ISO
        run: |
          mkdir -p output
          sudo podman pull "${IMAGE_REGISTRY}/${IMAGE_NAME}:latest"
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/disk_config/iso.toml":/config.toml:ro \
            -v "$PWD/output":/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso --use-librepo=True --rootfs btrfs \
            ${IMAGE_REGISTRY}/${IMAGE_NAME}:latest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: os-iso
          path: output/**/*
