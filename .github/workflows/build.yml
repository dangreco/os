---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# yamllint disable rule:line-length rule:comments
name: build
on:
  push:
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].*"] # release tags -> publish versioned image
  pull_request:
    branches: [dev]
  workflow_dispatch:
env:
  IMAGE_NAME: os
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # the gate below diffs the PR head against its base
      # `build` is a required status check on dev, so this job must always run and
      # report. A `paths:` filter on the trigger would leave the check pending
      # forever on doc-only PRs; instead the costly steps below are gated and the
      # job still finishes green.
      - id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Only these paths can change the image: the Containerfile, the scripts
          # it executes, the tree it bakes in, and this workflow itself.
          RELEVANT='^(Containerfile$|build_files/|system_files/|\.github/workflows/build\.yml$)'
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request — building." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          CHANGED=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          if grep -qE "$RELEVANT" <<< "$CHANGED"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            printf 'Image inputs changed — building.\n\n```\n%s\n```\n' "$CHANGED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            printf 'No image inputs changed — image build skipped.\n\n```\n%s\n```\n' "$CHANGED" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.gate.outputs.build == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.1'
      - id: build
        if: steps.gate.outputs.build == 'true'
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2.13
        with:
          containerfiles: ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          # On a release tag build, also publish :<version> (e.g. :2026.07.0).
          tags: latest ${{ github.sha }}${{ github.ref_type == 'tag' && format(' {0}', github.ref_name) || '' }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          oci: true
      - id: push
        if: github.ref_type == 'tag'
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref_type == 'tag'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign -y --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false --registry-referrers-mode=legacy --registry-username "${REGISTRY_USERNAME}" --registry-password "${REGISTRY_PASSWORD}" "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

  # Build an installable ISO from the freshly-published :<version> image and attach it
  # (plus a SHA256 checksum and a cosign bundle) to the release the tag created.
  release-iso:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # append the S3 download links to the release notes
      packages: read # pull the versioned image from GHCR
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.1'
      - name: Build ISO from the versioned image
        run: |
          set -euo pipefail
          sudo podman login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          mkdir -p output
          sudo podman pull "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}"
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/disk_config/iso.toml":/config.toml:ro \
            -v "$PWD/output":/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso --use-librepo=True --rootfs btrfs \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}"
          sudo mv output/bootiso/install.iso "os-${VERSION}.iso"
          sudo chown "$(id -u):$(id -g)" "os-${VERSION}.iso"
      - name: Checksum and sign the ISO
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          sha256sum "os-${VERSION}.iso" > "os-${VERSION}.iso.sha256"
          cosign sign-blob -y --key env://COSIGN_PRIVATE_KEY \
            --bundle "os-${VERSION}.iso.bundle" "os-${VERSION}.iso"
      - name: Stage release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          mv "os-${VERSION}.iso" "os-${VERSION}.iso.sha256" "os-${VERSION}.iso.bundle" dist/
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Upload ISO to S3 (retain only the current version)
        env:
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
        run: |
          set -euo pipefail
          # --delete removes any prior version's files, so only the current set
          # remains. Versioned filenames are immutable — cache them aggressively.
          aws s3 sync dist/ "s3://${AWS_BUCKET}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"
      - name: Link the ISO from the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          # release-tag.yml creates the release before triggering this build, but the
          # ISO build outpaces it only rarely — wait briefly in case of a race.
          for _ in $(seq 1 30); do
            gh release view "$VERSION" >/dev/null 2>&1 && break || sleep 10
          done
          BASE="https://${AWS_BUCKET}.s3.${AWS_REGION}.amazonaws.com"
          BODY=$(gh release view "$VERSION" --json body -q .body)
          gh release edit "$VERSION" --notes "$(printf '%s\n\n## Download\n- ISO: %s/os-%s.iso\n- SHA256: %s/os-%s.iso.sha256\n- cosign bundle: %s/os-%s.iso.bundle\n' \
            "$BODY" "$BASE" "$VERSION" "$BASE" "$VERSION" "$BASE" "$VERSION")"
