---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# yamllint disable rule:line-length rule:comments
name: build
on:
  push:
    branches: [main]
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].*"] # release tags -> publish versioned image
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly: pick up base-image updates
  workflow_dispatch:
env:
  IMAGE_NAME: os
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: build
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2.13
        with:
          containerfiles: ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          # On a release tag build, also publish :<version> (e.g. :2026.07.0).
          tags: latest ${{ github.sha }}${{ github.ref_type == 'tag' && format(' {0}', github.ref_name) || '' }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          oci: true
      - id: push
        if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2.8
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign -y --key env://COSIGN_PRIVATE_KEY --registry-username "${REGISTRY_USERNAME}" --registry-password "${REGISTRY_PASSWORD}" "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

  # Build an installable ISO from the freshly-published :<version> image and attach it
  # (plus a SHA256 checksum and a cosign signature) to the release the tag created.
  release-iso:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the ISO asset to the release
      packages: read # pull the versioned image from GHCR
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build ISO from the versioned image
        run: |
          set -euo pipefail
          sudo podman login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          mkdir -p output
          sudo podman pull "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}"
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/disk_config/release-iso.toml":/config.toml:ro \
            -v "$PWD/output":/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso --use-librepo=True --rootfs btrfs \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VERSION}"
          sudo mv output/bootiso/install.iso "os-${VERSION}.iso"
          sudo chown "$(id -u):$(id -g)" "os-${VERSION}.iso"
      - name: Checksum and sign the ISO
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          sha256sum "os-${VERSION}.iso" > "os-${VERSION}.iso.sha256"
          cosign sign-blob -y --key env://COSIGN_PRIVATE_KEY \
            --output-signature "os-${VERSION}.iso.sig" "os-${VERSION}.iso"
      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # release-tag.yml creates the release before triggering this build, but the
          # ISO build outpaces it only rarely — wait briefly in case of a race.
          for _ in $(seq 1 30); do
            gh release view "$VERSION" >/dev/null 2>&1 && break || sleep 10
          done
          gh release upload "$VERSION" \
            "os-${VERSION}.iso" "os-${VERSION}.iso.sha256" "os-${VERSION}.iso.sig" --clobber
