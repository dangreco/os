---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# yamllint disable rule:line-length rule:comments
name: dependabot-automerge
# Enables auto-merge on Dependabot PRs. With the merge queue required on dev, this
# only queues the PR — GitHub merges it when the required checks are green and the
# branch merges cleanly. Nothing here bypasses CI.
on:
  pull_request:
    branches: [dev]
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Best-effort, mirroring release-pr.yml:135-139 — GitHub rejects enabling
      # auto-merge when the repo setting is off or the PR is already mergeable,
      # and that must not turn the workflow red.
      - env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr merge --auto --squash "$PR_URL" \
            || echo "::warning::could not enable auto-merge for $PR_URL"
