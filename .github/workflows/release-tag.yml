---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# yamllint disable rule:line-length rule:comments
name: release-tag
# Fires when a release PR merges (VERSION changes on dev). Tags the release,
# fast-forwards main to the release commit, and creates a GitHub Release; the
# tag push then triggers the versioned image build.
on:
  push:
    branches: [dev]
    paths:
      - VERSION
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # App token so the pushed tag triggers build.yml (GITHUB_TOKEN would not).
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - id: tag
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fast-forward main to the release commit
        # HEAD is dev's tip (the release commit). Idempotent — a no-op when main
        # already points here. main is always an ancestor of dev by construction,
        # so a non-fast-forward here signals real divergence and should fail.
        run: git push origin "HEAD:refs/heads/main"
      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip header --output notes.md
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Create or update GitHub Release
        # Idempotent: re-running this workflow (e.g. after a transient failure
        # like a download 503) edits the existing release in place rather than
        # stranding it. A pre-existing tag no longer short-circuits this step.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --notes-file notes.md
          else
            gh release create "$VERSION" --title "$VERSION" --notes-file notes.md
          fi
