---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
# yamllint disable rule:line-length rule:comments
name: release-tag
# Fires when a release PR merges (VERSION changes on main). Tags the release and
# creates a GitHub Release; the tag push then triggers the versioned image build.
on:
  push:
    branches: [main]
    paths:
      - VERSION
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # App token so the pushed tag triggers build.yml (GITHUB_TOKEN would not).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - id: tag
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists, skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Generate release notes
        if: steps.tag.outputs.created == 'true'
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip header --output notes.md
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Create GitHub Release
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: gh release create "$VERSION" --title "$VERSION" --notes-file notes.md
