---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  IMAGE_NAME: os
  DEFAULT_TAG: latest
  BIB_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest

tasks:
  build-qcow2:
    desc: Build a qcow2 disk image (output/qcow2/disk.qcow2)
    cmd: task image:_bib TYPE=qcow2 CONFIG=disk_config/disk.toml

  build-raw:
    desc: Build a raw disk image (output/image/disk.raw)
    cmd: task image:_bib TYPE=raw CONFIG=disk_config/disk.toml

  build-iso:
    desc: Build an installable ISO (output/bootiso/install.iso)
    cmd: task image:_bib TYPE=iso CONFIG=disk_config/iso.toml

  _bib:
    internal: true
    requires:
      vars: [TYPE, CONFIG]
    cmds:
      - mkdir -p output
      - >-
        sudo podman run --rm -it --privileged --pull=newer --net=host --security-opt label=type:unconfined_t -v {{.CONFIG}}:/config.toml:ro -v ./output:/output -v /var/lib/containers/storage:/var/lib/containers/storage {{.BIB_IMAGE}} --type {{.TYPE}} --use-librepo=True --rootfs btrfs localhost/{{.IMAGE_NAME}}:{{.DEFAULT_TAG}}
  run-vm-qcow2:
    desc: Boot the qcow2 in a VM (open http://localhost:8006)
    cmd: >-
      sudo podman run --rm -it --privileged --pull=newer --publish 127.0.0.1:8006:8006 --device=/dev/kvm --volume ./output/qcow2/disk.qcow2:/boot.qcow2 docker.io/qemux/qemu

  run-vm-iso:
    desc: Boot the installer ISO in a VM (open http://localhost:8006)
    cmd: >-
      sudo podman run --rm -it --privileged --pull=newer --publish 127.0.0.1:8006:8006 --device=/dev/kvm --volume ./output/bootiso/install.iso:/boot.iso docker.io/qemux/qemu
